id: bbc

name: BBC

base_url: https://www.bbc.com

rss_url: http://feeds.bbci.co.uk/news/rss.xml

# BBC Future (science, health, environment, ideas), read with the news
# feed, interleaved: bbc.com is one domain, so it is a feed of this source
# rather than a source of its own (src/models/core/source.py, 2026-11-10).
extra_feeds:
  - https://www.bbc.com/future/feed.rss

search_url: https://www.bbc.co.uk/search?q={query}

language: en

country: UK

source_type: news

reliability_index: 0.94

enabled: true

requires_javascript: false

tags:
  - general
  - world
  - politics
  - technology
  - science

groups:
  - society
  - science
  - environment
  - health

# The Devastating edition's groups (docs/decisions/editions.md).
devastating_groups:
  - violence
  - hate
  - despair
  - catastrophe
  - abuse_of_power

metadata:
  extractor: trafilatura
  discovery:
    - rss
    - search