# A source of the Devastating edition only (docs/decisions/editions.md):
# no positive `groups`, so the positive edition never reads it.
# Germany's public broadcaster in Spanish: world news, much of it conflict.
# Feed checked live on 2026-10-30. Its reliability rating is a first
# estimate by Claude on that day, not yet reviewed by a person.

id: dw_es

name: DW Español

base_url: https://www.dw.com

rss_url: https://rss.dw.com/xml/rss-sp-all

language: es

country: DE

source_type: news

reliability_index: 0.9

enabled: true

requires_javascript: false

tags:
  - world

devastating_groups:
  - violence
  - hate
  - catastrophe
  - abuse_of_power

metadata:
  extractor: trafilatura
  discovery:
    - rss
