# Largely rewrites other outlets' stories, often without linking the
# primary source: a steady supply of on-topic articles, but rated as a
# blog when it turns up as evidence.

id: good_news_network

name: Good News Network

base_url: https://www.goodnewsnetwork.org

rss_url: https://www.goodnewsnetwork.org/feed/

search_url: https://www.goodnewsnetwork.org/?s={query}

language: en

country: US

source_type: blog

reliability_index: 0.65

enabled: true

requires_javascript: false

tags:
  - community
  - society
  - wildlife

groups:
  - society
  - environment
  - culture
  # Added 2026-10-09: it files medical research under Health (a heart-failure
  # treatment from pomegranate compounds that day), and Health had no
  # outlet that chooses its stories for positive impact.
  - health

# Publishes only positive news: discovery's mission screen leaves it
# alone (src/models/core/source.py).
positive_editorial: true

metadata:
  extractor: trafilatura
  discovery:
    - rss
    - search
