[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.128.8",
    "feedparser>=6.0.12",
    "gliner>=0.2.26",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "neo4j>=5.28.4",
    "openai>=2.44.0",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.16.1",
    "requests>=2.32.5",
    "scipy>=1.13.1",
    "sentence-transformers>=5.1.2",
    "starlette>=0.49.3",
    "textblob>=0.19.0",
    "textstat>=0.7.13",
    "torch>=2.8.0",
    "trafilatura>=2.0.0",
    "transformers>=4.57.6",
    "uvicorn>=0.39.0",
    "yake>=0.4.8",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
