[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 3.12, matching backend/.python-version and the python:3.12-slim base
# image. It said >=3.9, which was never true - the code uses `X | None`
# annotations (3.10+) and tests/test_invariants.py imports tomllib
# (3.11+). It was also expensive: resolving for 3.9 split the lock into
# two torch versions, and the one chosen for 3.10+ was torch 2.13, which
# pulls cuda-toolkit and ~2.5GB of nvidia wheels.
requires-python = ">=3.12"
# gliner, torch, transformers, sentence-transformers, scipy and
# textblob moved to inference/pyproject.toml - GLiNER, the sentiment
# model and the embedding model all load there now, reached over HTTP
# via src/services/inference_client.py. Backend itself no longer needs
# torch at all, which is most of what made this image slow and
# occasionally CUDA-toolkit-hungry to build (see the [tool.uv.sources]
# block that used to live here, and inference/pyproject.toml's copy of
# it - that workaround moved with the dependency that needed it).
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.128.8",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "neo4j>=5.28.4",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.16.1",
    "requests>=2.32.5",
    "starlette>=0.49.3",
    "textstat>=0.7.13",
    "trafilatura>=2.0.0",
    "uvicorn>=0.39.0",
    "yake>=0.4.8",
]

[project.optional-dependencies]
# The last step of the extraction cascade (a headless browser) is
# optional: it is the only one that needs a ~150MB Chromium download on
# top of the package, and without it the cascade simply stops after
# BeautifulSoup and says so ("unavailable") in the scraper stats.
#   uv sync --extra browser && uv run playwright install chromium
# The Docker image installs both. See docs/decisions/scraping.md.
browser = [
    "playwright>=1.60.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Excluded by default, and by marker rather than by `--ignore=<path>`:
# the flag had to be remembered on every invocation, and forgetting it
# ran a test that wrote over committed sample fixtures. Run them with
# `./scripts/check.sh slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: loads the full model stack over the whole data/raw corpus (minutes, not seconds)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
