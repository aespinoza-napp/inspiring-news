services:
  neo4j:
    image: neo4j:5  # pinned - "latest" will bite you eventually
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Read from backend/.env, the one place the password lives, so the
      # two can never disagree. Compose only interpolates from the shell
      # or an env file, so run it with `--env-file ../backend/.env`
      # (scripts/dev.sh does). The password used to be written here in
      # plain text and is therefore in git history: treat that value as
      # compromised and set a new one.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD - run compose with --env-file ../backend/.env}
      # Without these, Neo4j's JVM auto-sizes heap + page cache based on
      # available host RAM - dangerous on an 8GB machine that's also
      # holding a local LLM in memory. Capped small since this is a dev
      # graph, not production scale.
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    mem_limit: 1g
    healthcheck:
      # backend depends on Bolt being ready, not just the container
      # existing - without this, first boot can race and fail.
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    mem_limit: 256m
    healthcheck:
      # "service_started" (the old depends_on condition below) only
      # meant the container process existed, not that SearXNG's HTTP
      # server was accepting connections yet - SearXNG is itself a
      # Python app with real startup time. A backend request that hits
      # evidence retrieval before this is ready fails intermittently,
      # which looks exactly like "sometimes docker works, sometimes
      # not" even though the container came up fine. format=json
      # requires docker/searxng/settings.yml's `formats: [..., json]`,
      # already enabled - it's what SearxngClient itself calls.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/search?q=test&format=json"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  inference:
    # Model server for GLiNER, the sentiment classifier and the
    # sentence-transformer embedding model - what backend/ used to load
    # in-process. See inference/README.md and docs/decisions/. backend
    # reaches this over HTTP via src/services/inference_client.py -
    # see backend's `environment`/`depends_on` below.
    build:
      context: ../inference
      dockerfile: ../docker/inference.Dockerfile
    volumes:
      # Moved from `backend` below - the transformer models now live
      # here, not in the API/orchestration container.
      - model-cache:/models
    # Measured with `docker stats`, warm and idle: 3.58GiB resident with
    # all three models loaded (BAAI/bge-m3 dominates at ~2.2GB). 4g put
    # that at 89% of the cap before serving a single request, so 6g -
    # inference allocates per request on top of the resident weights,
    # and being OOM-killed here is not a graceful degradation.
    #
    # Worth knowing what this number implies about the old layout:
    # before the split these same models loaded inside `backend`, which
    # has always been capped at 1g (see below). ~3.6GB of models under
    # a 1GB cap means the kernel would OOM-kill that container the
    # moment a request triggered the lazy model load - i.e. on the
    # first real /analyze, not at boot, which matches "the container
    # starts fine and then sometimes doesn't work". Not directly
    # observed (per CLAUDE.md the backend container had never been run
    # end to end until this change), so: a definite latent bug and a
    # strong candidate for the reported flakiness rather than a
    # confirmed diagnosis. An OOM kill is also the least graceful
    # shutdown there is, which is exactly how Qdrant's lock gets left
    # stale - see backend's stop_grace_period below.
    mem_limit: 6g
    healthcheck:
      # 200 only once every model is actually loaded (src/main.py),
      # not merely "the process started" - this is what lets backend's
      # `depends_on: inference: condition: service_healthy` (once wired
      # in) block real traffic until the models are warm, instead of the
      # old in-process behaviour where the first request after boot ate
      # the model-load cost itself.
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      # Measured, not guessed: a genuinely cold model-cache volume (all
      # three models downloading from scratch - BAAI/bge-m3 alone is
      # ~2.2GB) took ~11 minutes to go healthy in testing. A shorter
      # start_period doesn't just log a warning here - Compose's
      # `depends_on: condition: service_healthy` treats a container that
      # reports unhealthy *before* start_period elapses as a failed
      # dependency and refuses to start backend at all (backend now
      # waits on exactly this, below), which would make every fresh
      # `docker compose up --build` fail outright on exactly the
      # download this healthcheck exists to wait for.
      start_period: 900s
      retries: 5

  backend:
    build:
      # The context is backend/, not this directory and not the repo
      # root: the Dockerfile only ever needs the backend, and a repo-root
      # context would also ship frontend/node_modules and .git - slow
      # enough to dominate the build when running from WSL against
      # /mnt/c. See backend/.dockerignore for what else is excluded.
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Relative to THIS file, so it must climb out of docker/ - the
      # backend's .env lives at backend/.env. Copy it from
      # backend/.env-example first; compose refuses to start if the file
      # is missing.
      - ../backend/.env
    environment:
      # These three override .env values that are correct for running the
      # backend on the host but wrong inside a container, where
      # "localhost" is the container itself.
      #
      # Container-to-container DNS names for the compose services:
      - SEARXNG_URL=http://searxng:8080
      - NEO4J_URI=bolt://neo4j:7687
      - INFERENCE_URL=http://inference:8001
      # Ollama is NOT part of this compose file - it runs on the host
      # (see CLAUDE.md's LLMClient note), so the container reaches it
      # through Docker's host gateway rather than its own localhost.
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      # host.docker.internal resolves natively on Docker Desktop, but not
      # on plain Linux/WSL engines - this makes the LLM_BASE_URL above
      # work on both.
      - "host.docker.internal:host-gateway"
    volumes:
      # Runtime data written by the pipeline: the local Qdrant store, the
      # analysis cache and the three-layer lake (raw/processed/
      # exploitation). Named volumes, so the fact-check corpus and the
      # lake survive `docker compose down` - without this every restart
      # starts from an empty vector collection, and duplicate detection
      # has nothing to compare against.
      - backend-data:/app/data
      # The source YAMLs are configuration, not runtime data, but they
      # live under data/ - which .dockerignore keeps out of the image and
      # the volume above shadows anyway. Without this mount the container
      # saw zero sources: /sources and ingestion listed nothing, and every
      # domain lost its reliability rating. Read-only, from the host, so a
      # YAML edit needs a restart rather than a rebuild.
      - ../backend/data/sources:/app/data/sources:ro
      # model-cache moved to the `inference` service above - the
      # transformer models live there now, not here.
    depends_on:
      neo4j:
        condition: service_healthy
      searxng:
        condition: service_healthy
      # 900s start_period on inference's own healthcheck (above) means
      # this can legitimately block a first `docker compose up` for
      # several minutes on a cold model-cache volume - turning what used
      # to be an in-process, per-request model-load stall into an
      # up-front, one-time wait before backend accepts any traffic at
      # all, rather than the first /analyze call silently eating it.
      inference:
        condition: service_healthy
    # No model weights held here anymore (see `inference` above), so
    # 1g is no longer a cap this container can blow through on its
    # first real request. Measured warm: 230MiB of 512m (45%). Qdrant's
    # own memory use scales with corpus size, so re-check `docker
    # stats` before treating this as a permanent ceiling.
    mem_limit: 512m
    # Gives the process real time to release Qdrant's exclusive
    # storage-directory lock (backend/src/database/qdrant.py) on SIGTERM
    # before Compose escalates to SIGKILL. Without this, an unclean stop
    # (an OOM kill under mem_limit, `docker kill`, a hard host shutdown)
    # can leave the lock held, and the next `up` has to burn through the
    # 15x1s retry loop there - and can still lose. This is the best-fit
    # explanation for "sometimes docker executes and sometimes not" at
    # the request level: the container starts fine, but the first call
    # that touches VectorRepository fails.
    stop_grace_period: 30s

volumes:
  backend-data:
  model-cache: