services:
  neo4j:
    image: neo4j:5  # pinned - "latest" will bite you eventually
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Must match NEO4J_PASSWORD in backend/.env - GraphClient
      # (backend/src/database/neo4j_client.py) is dead code today, so
      # nothing surfaces the mismatch yet, but the moment something
      # calls it, a wrong password here looks exactly like the
      # intermittent "sometimes it works" failures this file's other
      # comments describe. Two hardcoded copies of the same secret is
      # not ideal, but the alternative (Compose ${VAR} interpolation
      # from a new docker/.env) is more machinery for a credential
      # nothing currently uses.
      - NEO4J_AUTH=neo4j/aEm7V1HyGck1B3VXYNzY
      # Without these, Neo4j's JVM auto-sizes heap + page cache based on
      # available host RAM - dangerous on an 8GB machine that's also
      # holding a local LLM in memory. Capped small since this is a dev
      # graph, not production scale.
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    mem_limit: 1g
    healthcheck:
      # backend depends on Bolt being ready, not just the container
      # existing - without this, first boot can race and fail.
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    mem_limit: 256m
    healthcheck:
      # "service_started" (the old depends_on condition below) only
      # meant the container process existed, not that SearXNG's HTTP
      # server was accepting connections yet - SearXNG is itself a
      # Python app with real startup time. A backend request that hits
      # evidence retrieval before this is ready fails intermittently,
      # which looks exactly like "sometimes docker works, sometimes
      # not" even though the container came up fine. format=json
      # requires docker/searxng/settings.yml's `formats: [..., json]`,
      # already enabled - it's what SearxngClient itself calls.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/search?q=test&format=json"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      # The context is backend/, not this directory and not the repo
      # root: the Dockerfile only ever needs the backend, and a repo-root
      # context would also ship frontend/node_modules and .git - slow
      # enough to dominate the build when running from WSL against
      # /mnt/c. See backend/.dockerignore for what else is excluded.
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Relative to THIS file, so it must climb out of docker/ - the
      # backend's .env lives at backend/.env. Copy it from
      # backend/.env-example first; compose refuses to start if the file
      # is missing.
      - ../backend/.env
    environment:
      # These three override .env values that are correct for running the
      # backend on the host but wrong inside a container, where
      # "localhost" is the container itself.
      #
      # Container-to-container DNS names for the two compose services:
      - SEARXNG_URL=http://searxng:8080
      - NEO4J_URI=bolt://neo4j:7687
      # Ollama is NOT part of this compose file - it runs on the host
      # (see CLAUDE.md's LLMClient note), so the container reaches it
      # through Docker's host gateway rather than its own localhost.
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      # host.docker.internal resolves natively on Docker Desktop, but not
      # on plain Linux/WSL engines - this makes the LLM_BASE_URL above
      # work on both.
      - "host.docker.internal:host-gateway"
    volumes:
      # Runtime data written by the pipeline: the local Qdrant store, the
      # analysis cache and the three-layer lake (raw/processed/
      # exploitation). Named volumes, so the fact-check corpus and the
      # lake survive `docker compose down` - without this every restart
      # starts from an empty vector collection, and duplicate detection
      # has nothing to compare against.
      - backend-data:/app/data
      # The transformer models (GLiNER, embeddings, sentiment) download
      # on first use - several GB. Cached here so that cost is paid once,
      # not on every container start.
      - model-cache:/models
    depends_on:
      neo4j:
        condition: service_healthy
      searxng:
        condition: service_healthy
    mem_limit: 1g
    # Gives the process real time to release Qdrant's exclusive
    # storage-directory lock (backend/src/database/qdrant.py) on SIGTERM
    # before Compose escalates to SIGKILL. Without this, an unclean stop
    # (an OOM kill under mem_limit, `docker kill`, a hard host shutdown)
    # can leave the lock held, and the next `up` has to burn through the
    # 15x1s retry loop there - and can still lose. This is the best-fit
    # explanation for "sometimes docker executes and sometimes not" at
    # the request level: the container starts fine, but the first call
    # that touches VectorRepository fails.
    stop_grace_period: 30s

volumes:
  backend-data:
  model-cache: