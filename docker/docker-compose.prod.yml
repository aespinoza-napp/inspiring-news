# Production overrides, layered on docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file ../backend/.env up -d --build
#
# Everything here is what a server needs and a laptop does not: nothing
# reachable but the API and the UI, both on loopback; every secret
# required rather than defaulted; restarts after a crash or a reboot;
# bounded logs; the LLM as a service of its own instead of an Ollama the
# host happens to run; and the frontend as a container. Sizing and the
# reasoning behind each limit: docs/decisions/deployment.md.

x-logging: &logging
  # Docker's default json-file driver never rotates: a stack that logs
  # every phase of every run fills the disk eventually. 5 x 10MB per
  # container: one four-claim analysis wrote 140 lines, 20KB, to the
  # backend's log (2026-10-01, polling included), so ~2,500 runs are
  # kept. This is also what `docker compose logs` reads.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  neo4j:
    # The browser (7474) and Bolt (7687) stay on the compose network.
    # Reach the console through an SSH tunnel, not the internet.
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    # Measured 2026-10-01 under the dev cap of 1g: 819MiB resident at
    # peak (512m heap + 256m page cache + the JVM's own), and the cgroup
    # hit its limit 120 times. Not an OOM kill, but no headroom for a
    # graph sync or a heavy console query either.
    mem_limit: 1536m

  # The Devastating edition's graph, closed and capped like `neo4j`.
  neo4j-devastating:
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m

  searxng:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  inference:
    restart: unless-stopped
    logging: *logging

  ollama:
    # Pinned to the version the dev machine ran when the stack was sized
    # (2026-10-01). On a server there is no host Ollama for
    # host.docker.internal to reach, so it moves into compose.
    image: ollama/ollama:0.35.0
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep the model loaded. Ollama's default unloads it after 5
      # minutes idle, and the next claim then pays the load.
      - OLLAMA_KEEP_ALIVE=-1
      # One request at a time, like the backend's LLM_MAX_CONCURRENCY
      # below. On a CPU, parallel requests share the same cores: each
      # gets slower and none gets done sooner. It also holds one
      # context's KV cache in memory instead of one per slot.
      - OLLAMA_NUM_PARALLEL=1
      # One model in memory at a time. With a writer configured beside
      # the verifier, both stayed loaded for good (KEEP_ALIVE=-1): ~3.2
      # GB plus ~6 GB at a 16k context, on a 16 GB machine already ~9.6
      # GB resident. Ollama now unloads the idle one to load the other,
      # and the backend sends one LLM call at a time anyway
      # (LLM_MAX_CONCURRENCY=1), so the swap - seconds to load a model
      # from disk - is paid only when a draft follows a verdict or the
      # other way round (docs/decisions/deployment.md, "Models in memory").
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: unless-stopped
    logging: *logging
    # llama3.2:3b (Q4_K_M) at a 4096-token context: 2.9GB loaded,
    # measured with /api/ps on 2026-10-01. Sized for the largest model
    # served, not the sum (one at a time, above): set OLLAMA_MEM_LIMIT in
    # backend/.env to ~8g for a 7-9B writer at 16k context.
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-pull:
    # One-shot: fetches every model backend/.env names - LLM_MODEL, and
    # the writer's and the corrector's when set, creating the writer's
    # long-context variant - into the ollama-models volume, then exits.
    # A no-op once they are there. backend waits for it to finish, so
    # neither the first verdict nor the first draft meets a missing model.
    image: ollama/ollama:0.35.0
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    volumes:
      - ./ollama/pull-models.sh:/pull-models.sh:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:?set LLM_MODEL in backend/.env}
      - WRITER_LLM_MODEL=${WRITER_LLM_MODEL:-}
      - WRITER_LLM_BASE=${WRITER_LLM_BASE:-}
      - WRITER_NUM_CTX=${WRITER_NUM_CTX:-16384}
      - CORRECTOR_LLM_MODEL=${CORRECTOR_LLM_MODEL:-}
      - CORRECTOR_LLM_BASE=${CORRECTOR_LLM_BASE:-}
      # Unset: Ollama's own choice (pull-models.sh, performance.md).
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    # Loopback only: a reverse proxy on the host (Caddy, nginx) or the
    # frontend's server routes on the same machine are what talk to it.
    # Published on every interface, /storage/* and /graph/query would be
    # one leaked key away from the internet.
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      # The dev defaults (2 at once, 30s each) assume the laptop's GPU.
      # On a CPU they turned verdicts into errors: the first production
      # run (2026-10-01) sent 4 claims at Ollama together, each took
      # 90-103s, and 3 of the 4 timed out twice and came back UNVERIFIED
      # as "LLM provider was unreachable". One at a time, each call is
      # the 40-50s a CPU needs; the timeout leaves it room to finish.
      # The wait for the permit is not counted: it is taken before the
      # request is sent (docs/decisions/concurrency.md).
      - LLM_MAX_CONCURRENCY=1
      - LLM_TIMEOUT=180
      # Inference is on the CPU here too. In the X-Fact pilot's first
      # session (2026-10-13) four claims at once pushed the ranker's
      # batched bge-m3 requests past the 30 s default and 5 of 20 claims
      # died with InferenceUnavailable, every one answered late; two
      # claims at once and 120 s ran the rest of the pilot without one
      # (docker-compose.eval.yml, docs/decisions/evaluation.md). Neither
      # changes what the pipeline decides, only whether it gets to decide.
      - INFERENCE_TIMEOUT=120
      - CLAIM_MAX_CONCURRENCY=2
      # Required here, optional in dev: unset, /storage/* and the graph
      # console are open to whoever can reach the port (src/main.py
      # warns; here it refuses to start instead).
      - STORAGE_API_KEY=${STORAGE_API_KEY:?set STORAGE_API_KEY in backend/.env - production does not run without it}
      # Whatever backend/.env says: off, POST /analyze is an HTTP proxy
      # into this compose network.
      - URL_GUARD_ENABLED=true
      # One JSON object per line, so a log shipper can read the phase
      # timings as fields instead of parsing prose.
      - LOG_FORMAT=json
    # host.docker.internal pointed at the host's Ollama; there is none.
    extra_hosts: !reset []
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    # Measured 2026-10-01 under the dev cap of 512m: the process itself
    # peaks at 232MiB, with Chromium rendering a page (77MiB without).
    # The rest of the cap went to file cache (Qdrant's storage, the
    # lake), and the cgroup hit its limit 10,276 times reclaiming it.
    # Both grow with the corpus; 1g gives them room.
    mem_limit: 1g

  frontend:
    # The UI, on the same machine as the API it calls - not Cloud Run
    # (docs/decisions/deployment.md, "Where the frontend runs"). Next's
    # standalone server, built from frontend/ (docker/frontend.Dockerfile).
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    # Loopback, like the API: on a laptop, http://127.0.0.1:3000; on the
    # VM, an IAP tunnel to it, or Caddy over the compose network
    # (docker-compose.gcp.yml), which is the only door from outside.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # The compose network's name for the API: no hop through the host.
      - BACKEND_URL=http://backend:8000
      # Every server route sends it (frontend/src/app/api/README.md); the
      # backend refuses all but /healthz, /metrics and job polling
      # without it. The same variable as the backend's, so the two can
      # never disagree. Read at request time, never baked into the image.
      - STORAGE_API_KEY=${STORAGE_API_KEY:?set STORAGE_API_KEY in backend/.env - the frontend sends it on every call}
    # No depends_on: the frontend starts without the API, and each route
    # answers 502 "could not reach the backend" until it is up - on a
    # first boot that is the 10-15 minutes the models take to download,
    # better spent showing the page than a connection refused.
    restart: unless-stopped
    logging: *logging
    # Measured 2026-10-02 against a stub API: 35MiB idle, a peak RSS of
    # 121MiB over ~480 page and proxy requests in parallel bursts. The
    # server holds no state and caches nothing it fetches (every route is
    # no-store), so it should not grow with the corpus.
    mem_limit: 256m
    healthcheck:
      # The home page: prerendered at build time, so this asks whether
      # the Node server answers without touching the API - a backend
      # still loading its models must not make the frontend unhealthy.
      # Node's own fetch: the image has no curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ollama-models:
